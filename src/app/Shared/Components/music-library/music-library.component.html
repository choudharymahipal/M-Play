<section class="library-page">
  <p class="eyebrow">YOUR COLLECTION</p>
  <h1>Liked songs</h1>
  <ng-container *ngIf="favorites$ | async as tracks">
    <p class="library-count">{{ tracks.length }} saved {{ tracks.length === 1 ? 'track' : 'tracks' }}</p>
    <mat-card class="library-row" *ngFor="let track of tracks; let index = index">
      <span class="track-index">{{ index + 1 }}</span>
      <img [src]="track.artworkUrl" [alt]="track.album + ' artwork'" loading="lazy">
      <div class="track-info"><strong>{{ track.title }}</strong><span>{{ track.artist }} · {{ track.album }}</span></div>
      <button mat-icon-button (click)="music.toggleFavorite(track)" aria-label="Remove from liked songs"><mat-icon>favorite</mat-icon></button>
      <button mat-icon-button color="primary" (click)="play(track, tracks)" [attr.aria-label]="'Play ' + track.title"><mat-icon>play_arrow</mat-icon></button>
    </mat-card>
    <div class="empty-library" *ngIf="!tracks.length"><mat-icon>favorite_border</mat-icon><h2>Your library starts here</h2><p>Save tracks from search to keep them close.</p><button mat-flat-button color="primary" routerLink="/search">Browse music</button></div>
  </ng-container>
</section>
