<footer class="player-bar">
    <ng-container *ngIf="music.currentTrack$ | async as track; else emptyPlayer">
        <div class="track-summary">
            <img [src]="track.artworkUrl" [alt]="track.album + ' artwork'">
            <div class="track-copy"><strong>{{ track.title }}</strong><span>{{ track.artist }}</span><span class="playback-error" *ngIf="music.playbackError$ | async as playbackError">{{ playbackError }}</span></div>
            <button mat-icon-button (click)="music.toggleFavorite(track)" [attr.aria-label]="music.isFavorite(track) ? 'Remove from library' : 'Save to library'"><mat-icon>{{ music.isFavorite(track) ? 'favorite' : 'favorite_border' }}</mat-icon></button>
        </div>
        <section class="playback-controls" aria-label="Playback controls">
            <div class="control-buttons">
                <button mat-icon-button aria-label="Previous track" (click)="music.previousTrack()"><mat-icon>skip_previous</mat-icon></button>
                <button mat-fab color="primary" aria-label="Play or pause" (click)="music.togglePlayback()"><mat-icon>{{ (music.isPlaying$ | async) ? 'pause' : 'play_arrow' }}</mat-icon></button>
                <button mat-icon-button aria-label="Next track" (click)="music.nextTrack()"><mat-icon>skip_next</mat-icon></button>
            </div>
            <div class="timeline">
                <span>{{ formatTime((music.progress$ | async) || 0) }}</span>
                <mat-slider min="0" [max]="music.duration || 1" step="1" class="seek-slider"><input matSliderThumb [value]="(music.progress$ | async) || 0" (input)="seek($event)"></mat-slider>
                <span>{{ formatTime((music.duration$ | async) || 0) }}</span>
            </div>
        </section>
        <div class="volume-control">
            <mat-icon>{{ ((music.volume$ | async) || 0) === 0 ? 'volume_off' : 'volume_up' }}</mat-icon>
            <mat-slider min="0" max="1" step="0.01"><input matSliderThumb [value]="(music.volume$ | async) || 0" (input)="setVolume($event)"></mat-slider>
        </div>
    </ng-container>
    <ng-template #emptyPlayer>
        <div class="empty-player"><mat-icon>music_note</mat-icon><span>Choose a track to start listening</span><a mat-button routerLink="/search">Browse music</a></div>
    </ng-template>
</footer>
