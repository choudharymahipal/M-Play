<mat-toolbar class="topbar">
  <div class="toolbar-inner">
    <a mat-button class="brand" routerLink="/" aria-label="M-Play home">
      <span class="brand-mark"><mat-icon>graphic_eq</mat-icon></span><span>m-play</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a mat-button routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><mat-icon>home</mat-icon><span>Home</span></a>
      <a mat-button routerLink="/search" routerLinkActive="active-link"><mat-icon>search</mat-icon><span>Search</span></a>
      <a mat-button routerLink="/library" routerLinkActive="active-link"><mat-icon>video_library</mat-icon><span>Your library</span></a>
    </nav>
    <span class="toolbar-spacer"></span>
    <a mat-icon-button routerLink="/player" matTooltip="Open player" aria-label="Open player"><mat-icon>headphones</mat-icon></a>
    <button mat-icon-button (click)="toggleTheme()" [matTooltip]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'" aria-label="Toggle color theme"><mat-icon>{{ theme === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon></button>
  </div>
</mat-toolbar>
